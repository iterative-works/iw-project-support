# PURPOSE: Publishes the mill-iw-support Mill plugin to the iterative-works Forgejo Maven registry on pushes to main (snapshots) and mill-v* tags.
# PURPOSE: Additionally publishes releases to Maven Central (PGP-signed via Sonatype) on mill-v* tags.

name: Publish mill-iw-support

on:
  push:
    branches: [main]
    tags: ['mill-v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mill-iw-support
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Coursier dependencies
        uses: coursier/cache-action@v6

      # Every push publishes to the forge's own Maven registry: a main push publishes the
      # current -SNAPSHOT, a mill-vX.Y.Z tag publishes the release. MavenPublishModule detects
      # SNAPSHOT vs release from the version and routes accordingly — the release and snapshot
      # URIs are the same Forgejo endpoint, which requires no PGP signature. Credentials are
      # iterative-works org-level Actions secrets; the org is public so reads are anonymous.
      - name: Publish to Forgejo Maven registry
        env:
          MILL_MAVEN_USERNAME: ${{ secrets.MILL_MAVEN_USERNAME }}
          MILL_MAVEN_PASSWORD: ${{ secrets.MILL_MAVEN_PASSWORD }}
        run: |
          ./mill mill.javalib.MavenPublishModule/publishAll \
            --publishArtifacts mill-iw-support.publishArtifacts \
            --releaseUri https://code.iterative.works/api/packages/iterative-works/maven \
            --snapshotUri https://code.iterative.works/api/packages/iterative-works/maven

      # Releases additionally go to Maven Central via Sonatype (PGP-signed). Tags only.
      - name: Publish to Maven Central
        if: github.ref_type == 'tag'
        env:
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
        run: ./mill mill.javalib.SonatypeCentralPublishModule/publishAll --publishArtifacts mill-iw-support.publishArtifacts
